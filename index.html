<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Idle Craft</title>
  <meta name="description" content="A free idle crafting game. No ads, no paywalls, no tracking.">
  <meta name="theme-color" content="#2b2118">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">⚒️ Idle Craft</div>
    <div class="coins">🪙 <span id="coins">0</span></div>
  </header>

  <main id="view"></main>

  <nav class="nav">
    <button data-tab="gather"><span>🌲</span>Gather</button>
    <button data-tab="craft"><span>🛠️</span>Craft</button>
    <button data-tab="market"><span>🏪</span>Market</button>
    <button data-tab="upgrades"><span>⬆️</span>Upgrade</button>
    <button data-tab="stats"><span>📖</span>Book</button>
  </nav>

  <div id="toasts"></div>
  <div id="modal" hidden><div class="box"></div></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
